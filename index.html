<style>

.content{max-width:1320px;margin:auto;padding:34px 36px 80px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--green);font-weight:800}.heading{display:flex;justify-content:space-between;gap:20px;align-items:flex-end;margin-bottom:26px}.heading h1{font-size:clamp(27px,3.4vw,41px);line-height:1.1;letter-spacing:-.04em;margin:8px 0}.heading p{margin:0;color:var(--muted);max-width:640px}.actions{display:flex;gap:9px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:9px 13px;border-radius:10px;font-weight:650}.btn:hover{border-color:#64776a}.btn.primary{background:var(--green);border-color:var(--green);color:#172116}.btn.ghost{background:transparent}.btn.small{font-size:12px;padding:7px 10px}.grid{display:grid;gap:13px}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.card{background:linear-gradient(145deg,#1a211c,#151b17);border:1px solid var(--line);border-radius:var(--radius);padding:18px;min-width:0}.card h2,.card h3{margin:0 0 4px;letter-spacing:-.02em}.card h2{font-size:17px}.card h3{font-size:14px}.sub{color:var(--muted);font-size:12px;margin:0 0 15px}.metric{font-size:29px;font-weight:750;letter-spacing:-.04em;margin:8px 0 3px}.metric.green{color:var(--green)}.metric.pink{color:var(--pink)}.metric.yellow{color:var(--yellow)}.metric.red{color:var(--red)}.label{font-size:12px;color:var(--muted)}.formula{font:11px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;color:#8f9c91;border-top:1px solid var(--line);margin-top:13px;padding-top:10px}.section{margin:18px 0 10px;display:flex;align-items:flex-end;justify-content:space-between;gap:14px}.section h2{font-size:18px;margin:0;letter-spacing:-.02em}.section p{margin:2px 0 0;color:var(--muted);font-size:12px}.field{display:grid;gap:6px;margin:0 0 12px}.field label{color:#b7c2b9;font-size:12px}.field input,.field select,.field textarea,.cell{width:100%;background:#101612;color:var(--text);border:1px solid #354138;border-radius:9px;padding:9px 10px;outline:none}.field input:focus,.field select:focus,.field textarea:focus,.cell:focus{border-color:#8ccf67}.field textarea{min-height:75px;resize:vertical}.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:13px}table{width:100%;border-collapse:collapse;min-width:700px;background:#151b17}th,td{text-align:left;padding:10px 11px;border-bottom:1px solid #283129;vertical-align:top}th{font-size:10px;color:#89968b;text-transform:uppercase;letter-spacing:.08em;background:#19211b}td{font-size:12px;color:#d9e1da}tr:last-child td{border-bottom:0}.cell{padding:7px 8px;font-size:12px;min-width:76px}.cell.wide{min-width:150px}.badge{display:inline-flex;align-items:center;border-radius:99px;padding:4px 8px;font-size:10px;font-weight:750;background:#26322a;color:var(--green);white-space:nowrap}.badge.warn{background:#393021;color:var(--yellow)}.badge.red{background:#392726;color:var(--red)}.badge.neutral{background:#252c27;color:#b3beb5}.notice{padding:13px 15px;border:1px solid #394638;background:#1b261e;border-radius:12px;color:#c4d1c5;font-size:12px}.notice strong{color:var(--green)}.empty{padding:24px;text-align:center;color:var(--muted)}.channel{display:grid;grid-template-columns:1.1fr repeat(4,.7fr) auto;gap:8px;align-items:end}.channel .field{margin:0}.channelrow{padding:13px 0;border-bottom:1px solid var(--line)}.channelrow:last-child{border:0}.progress{height:6px;border-radius:8px;background:#2b332d;overflow:hidden}.progress i{display:block;height:100%;background:var(--green);border-radius:8px}.step{display:grid;grid-template-columns:36px 1fr;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}.step:last-child{border:0}.step .n{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:#263229;color:var(--green);font-size:12px;font-weight:800}.step h3{margin:0 0 3px}.step p{margin:0;color:var(--muted);font-size:12px}.twocol{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(280px,.8fr);gap:14px}.actionsbar{display:flex;gap:8px;flex-wrap:wrap}.muted{color:var(--muted)}.hidden{display:none!important}.check{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--muted)}.check input{accent-color:var(--green)}.fact{color:var(--yellow)}.tag{display:inline-block;border:1px solid var(--line);padding:4px 8px;border-radius:99px;font-size:10px;color:var(--muted)}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#e9f3e9;color:#142017;padding:10px 15px;border-radius:11px;box-shadow:0 8px 30px #0005;z-index:10}.canvas-two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.hero{background:linear-gradient(120deg,#202d23,#1a211c);border:1px solid #344238;border-radius:20px;padding:22px}.hero h2{margin:6px 0 8px;font-size:22px}.hero p{color:#b0bdb2;margin:0}.footerline{margin-top:18px;color:#7e8a80;font-size:11px}
@media(max-width:1000px){.app{grid-template-columns:76px 1fr}.side{padding:20px 9px}.brand{padding:0 10px}.brandtext,.navlabel,.nav button .text,.sidefoot{display:none}.nav button{justify-content:center;padding:12px}.nav .num{width:auto;font-size:13px}.g4{grid-template-columns:repeat(2,1fr)}.content{padding:26px 22px}.top{padding:0 22px}}
@media(max-width:700px){.app{grid-template-columns:1fr}.side{position:sticky;top:0;z-index:5;flex-direction:row;align-items:center;padding:8px 12px;border-right:0;border-bottom:1px solid var(--line);overflow:auto}.brand{padding:0}.navlabel,.sidefoot{display:none}.nav{display:flex;gap:3px}.nav button{padding:8px 9px;white-space:nowrap}.nav .num{display:none}.nav button .text{display:inline;font-size:11px}.workspace{min-width:0}.top{height:56px;padding:0 15px}.content{padding:22px 14px 55px}.heading{display:block}.heading .actions{margin-top:14px}.g4,.g3,.g2,.canvas-two,.twocol{grid-template-columns:1fr}.row3{grid-template-columns:1fr 1fr}.channel{grid-template-columns:1fr 1fr}.channel .field:first-child{grid-column:span 2}.heading h1{font-size:30px}.metric{font-size:27px}}

<body><div class="app"><aside class="side"><div class="brand"><div class="mark">M</div><div class="brandtext"><b>Market Pilot</b><small>GTM workspace</small></div></div><div class="navlabel">Стратегия запуска</div><nav class="nav" id="nav"></nav><div class="sidefoot">Прогноз — это гипотеза. Фиксируйте источники, проверяйте цифры в тесте.</div></aside><div class="workspace"><header class="top"><div class="crumb">Проект <span style="color:#eaf0ea">/</span> GTM-стратегия</div><div class="topright"><span class="pill">Черновик · 90 дней</span><div class="avatar">AL</div></div></header><main class="content" id="app"></main></div></div><div id="toast" class="toast hidden"></div>
<script>
const defaults={projectType:'education',product:'Офлайн-курсы 3D-моделирования и 3D-печати для школьников 10–15 лет',audience:'Родители детей 10–15 лет из Бостандыкского и Алмалинского районов Алматы; ребёнок участвует в выборе кружка',pain:'Ребёнок проводит много времени в телефоне; родители ищут полезное техническое хобби с видимым результатом',value:'Уже на первом уроке ребёнок печатает свою фигурку; за 3 месяца осваивает моделирование и создаёт проекты',difference:'Печать результата на каждом занятии, выставка работ каждый месяц, группы до 8 человек',attention:'Instagram, TikTok, школы, родительские чаты, мастер-классы и локальные сообщества',goal90:8,price:6000,cost:2235,tax:4,fees:0,payType:'regular',buysYear:2,years:2,churn:12.5,marketing:10000,target:8,
competitors:[['A','Reels',70,'Демонстрация занятия'],['A','Пост со скидкой',8,'Скидка'],['A','Карусель',30,'Показ работ'],['B','Пост со скидкой',10,'Скидка 10%'],['B','Карусель',40,'Подборка проектов'],['C','Пост со скидкой',6,'Скидка 15%'],['C','Карусель',35,'Показ проектов'],['C','Сторис-опрос',10,'Опрос аудитории'],['D','Пост со скидкой',8,'Скидка']].map(([name,format,reactions,offer])=>({name:'Конкурент '+name,url:'',channel:'Instagram',format,followers:1000,reactions,offer,date:'Тестовые данные из ТЗ',verified:true,known:'Учебный контрольный пример; замените наблюдениями из ПР №2'})),
channels:[{name:'Соцсети · платная реклама',paid:true,budget:40000,costContact:2500,contacts:16,conversion:18,why:'Проверка спроса на пробное занятие в Instagram / TikTok',source:'Контрольный пример из ТЗ; прогноз уточнить в рекламном кабинете',verified:true,side:'Родитель',fact:''},{name:'Сообщество · бесплатное размещение',paid:false,budget:0,costContact:0,contacts:40,conversion:5,why:'Родительские чаты и локальные сообщества',source:'Контрольный пример из ТЗ; охват уточнить тестом',verified:true,side:'Родитель',fact:''},{name:'Партнёрства · мастер-класс в школе',paid:true,budget:15000,costContact:500,contacts:30,conversion:10,why:'Демонстрация 3D-печати для школьников',source:'Ориентир из Claude-референса; проверить стоимость партнёрства',verified:false,side:'Родитель и ребёнок',fact:''}],
recommendations:{},plan:[],method:'Контрольный учебный набор из ТЗ: 4 условных конкурента, по 1 000 подписчиков; среднее ER рассчитывается по 9 строкам форматов. Это не замер реальных школ. Для проекта замените на 3–5 действующих конкурентов, соберите 5 последних неоплаченных публикаций и запишите дату. ER поста = реакции / подписчики × 100%.'};
const tabs=[['canvas','01','Канвас'],['competitors','02','Конкуренты'],['channels','03','Каналы'],['ai','04','Рекомендации ИИ'],['plan','05','Контент-план'],['summary','06','Итог']];let state=load();let current='canvas';
function load(){try{return {...structuredClone(defaults),...JSON.parse(localStorage.getItem('gtm-market-pilot')||'{}')}}catch{return structuredClone(defaults)}}function save(){localStorage.setItem('gtm-market-pilot',JSON.stringify(state))}function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function num(x){return Number(x)||0}function fmt(x,d=0){return Number.isFinite(x)?x.toLocaleString('ru-RU',{maximumFractionDigits:d}):'—'}function money(x){return Number.isFinite(x)?fmt(x)+' ₸':'—'}function toast(t){let e=document.querySelector('#toast');e.textContent=t;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),2200)}function margin(){return num(state.price)-num(state.cost)-num(state.price)*(num(state.tax)+num(state.fees))/100}function life(){return state.payType==='regular'?(num(state.churn)>0?100/num(state.churn):Infinity):num(state.buysYear)*num(state.years)}function ltv(){return margin()*life()}function targetCAC(){return num(state.target)>0?num(state.marketing)/num(state.target):NaN}function cRows(){return state.competitors.map(x=>({...x,er:num(x.followers)>0?num(x.reactions)/num(x.followers)*100:NaN}))}function cStats(){let rows=cRows(),overall=rows.filter(x=>Number.isFinite(x.er)).length?rows.reduce((s,x)=>s+(Number.isFinite(x.er)?x.er:0),0)/rows.filter(x=>Number.isFinite(x.er)).length:0;let formats=[...new Set(rows.map(x=>x.format).filter(Boolean))].map(f=>{let rr=rows.filter(x=>x.format===f&&Number.isFinite(x.er)),share=new Set(rows.filter(x=>x.format===f).map(x=>x.name)).size/Math.max(new Set(rows.map(x=>x.name)).size,1),er=rr.length?rr.reduce((s,x)=>s+x.er,0)/rr.length:0;return{format:f,er,share,group:er>overall?(share<.5?'Взять и усилить':'Делать, но иначе'):(share<.5?'Тестировать осторожно':'Не копировать')}});return{rows,overall,formats}}
function cResults(){let lt=ltv(),goal=num(state.target);return state.channels.map((c,i)=>{let contacts=c.paid?(num(c.costContact)>0?num(c.budget)/num(c.costContact):0):num(c.contacts),clients=contacts*num(c.conversion)/100,expense=c.paid?num(c.budget):num(c.budget),cac=clients>0?expense/clients:(expense===0?0:Infinity),ratio=cac===0?Infinity:lt/cac,status=expense===0?'Бесплатный':ratio>=3?'Окупится':ratio>=1?'Спорно':'В убыток';return{...c,i,contacts,clients,cac,ratio,status}})}function bestChannel(){return cResults().filter(c=>c.clients>=num(state.target)*.25).sort((a,b)=>b.ratio-a.ratio)[0]||null}
function nav(){document.querySelector('#nav').innerHTML=tabs.map(([id,n,label])=>`<button class="${current===id?'active':''}" data-tab="${id}"><span class="num">${n}</span><span class="text">${label}</span></button>`).join('')}
function head(kicker,title,desc,acts=''){return `<div class="heading"><div><div class="eyebrow">${kicker}</div><h1>${title}</h1><p>${desc}</p></div><div class="actions">${acts}</div></div>`}function field(label,key,value,type='text',extra=''){return `<div class="field"><label>${label}</label><input data-key="${key}" type="${type}" value="${esc(value)}" ${extra}></div>`}function textarea(label,key,value){return `<div class="field"><label>${label}</label><textarea data-key="${key}">${esc(value)}</textarea></div>`}function metric(title,value,formula,cls=''){return `<div class="card"><div class="label">${title}</div><div class="metric ${cls}">${value}</div><div class="formula">${formula}</div></div>`}
function renderCanvas(){let m=margin(),lt=ltv(),cac=targetCAC(),real=cac<=lt/3;return head('Вкладка 1 · Бизнес-модель','Канвас','Кому продаём, сколько приносит клиент и какой CAC выдерживает экономика.',`<button class="btn" data-action="reset">Сбросить</button>`)+`<div class="grid g4">${metric('Маржинальная прибыль',money(m),'Цена − себестоимость − налог − комиссия','green')}${metric('Срок жизни клиента',state.payType==='regular'?fmt(life(),1)+' мес.':fmt(life(),1)+' покупок',state.payType==='regular'?'1 ÷ месячный отток':'Покупки в год × годы','pink')}${metric('LTV',money(lt),'Маржа с клиента × срок жизни','green')}${metric('Допустимый CAC',money(lt/3),'LTV ÷ 3','yellow')}</div><div class="section"><div><h2>Проект и аудитория</h2><p>Измените описание под свой проект.</p></div><span class="tag">${real?'План реалистичен':'План требует пересмотра'}</span></div><div class="canvas-two"><div class="card"><div class="field"><label>Тип проекта</label><select data-key="projectType"><option value="goods" ${state.projectType==='goods'?'selected':''}>Разовые товары</option><option value="education" ${state.projectType==='education'?'selected':''}>Обучение и абонементы</option><option value="events" ${state.projectType==='events'?'selected':''}>События</option><option value="b2b" ${state.projectType==='b2b'?'selected':''}>B2B и под заказ</option><option value="platform" ${state.projectType==='platform'?'selected':''}>Платформа</option><option value="media" ${state.projectType==='media'?'selected':''}>Медиа</option></select></div>${field('Продукт','product',state.product)}${field('Целевая аудитория','audience',state.audience)}${textarea('Главная боль клиента','pain',state.pain)}${textarea('Ценностное предложение','value',state.value)}${field('Чем отличаемся','difference',state.difference)}${field('Где аудитория проводит время','attention',state.attention)}${field('Цель на 90 дней · новых клиентов','goal90',state.goal90,'number','min="0"')}</div><div class="card"><h2>Экономика и план</h2><p class="sub">Цифры из dashboard.html · часть источников пока ориентиры.</p><div class="row">${field('Цена, ₸','price',state.price,'number','min="0"')}${field('Себестоимость, ₸','cost',state.cost,'number','min="0"')}${field('Налог, %','tax',state.tax,'number','min="0" step="0.1"')}${field('Комиссии, %','fees',state.fees,'number','min="0" step="0.1"')}</div><div class="field"><label>Модель повторной оплаты</label><select data-key="payType"><option value="repeat" ${state.payType==='repeat'?'selected':''}>Несколько покупок</option><option value="regular" ${state.payType==='regular'?'selected':''}>Регулярно, по подписке</option></select></div><div class="row">${state.payType==='regular'?field('Отток в месяц, %','churn',state.churn,'number','min="0" step="0.1"'):field('Покупок в год','buysYear',state.buysYear,'number','min="0" step="0.1"')}${state.payType==='regular'?'':field('Лет отношений','years',state.years,'number','min="0" step="0.1"')}${field('Маркетинг-бюджет в месяц, ₸','marketing',state.marketing,'number','min="0"')}${field('Цель новых клиентов в месяц','target',state.target,'number','min="0"')}</div><div class="notice"><strong>Плановый CAC: ${money(cac)}</strong> = бюджет ÷ целевые клиенты. ${real?'Он ниже ⅓ LTV — план проходит ориентир.':'Он выше ⅓ LTV — пересмотрите бюджет или цель.'}<br><span class="muted">Проверено: исходные данные из dashboard.html; цель и повторные покупки — гипотеза команды.</span></div></div></div><p class="footerline">Источник цен и затрат: пользовательский dashboard.html. Цена 6 000 ₸, себестоимость 2 235 ₸, налог 4%. Повторные покупки и маркетинговая цель требуют проверки.</p>`}
function renderCompetitors(){let s=cStats();return head('Вкладка 2 · Рынок','Конкуренты','Сравните форматы публикаций и найдите позицию, которую рынок использует недостаточно.',`<button class="btn primary" data-action="add-competitor">＋ Добавить конкурента</button>`)+`<div class="grid g3">${metric('Конкурентов в сравнении',s.rows.length,'Добавляйте 3–5 конкурентов','')}${metric('Общее среднее ER',fmt(s.overall,2)+'%','Среднее ER по строкам таблицы','pink')}${metric('Форматов в матрице',s.formats.length,'Сравнение ER и доли конкурентов','yellow')}</div><div class="section"><div><h2>Сбор наблюдений</h2><p>ER поста = реакции ÷ подписчики × 100%. Для формата берите среднее последних 5 постов.</p></div></div><div class="tablewrap"><table><thead><tr><th>Конкурент / ссылка</th><th>Канал · формат</th><th>Подписчики</th><th>Средние реакции</th><th>ER поста</th><th>Оффер / заметки</th><th>Дата</th><th>Статус</th><th></th></tr></thead><tbody>${state.competitors.map((c,i)=>`<tr><td><input class="cell wide" data-list="competitors.${i}.name" value="${esc(c.name)}"><br><input class="cell wide" data-list="competitors.${i}.url" value="${esc(c.url)}" placeholder="Ссылка"></td><td><input class="cell" data-list="competitors.${i}.channel" value="${esc(c.channel)}"><br><select class="cell" data-list="competitors.${i}.format">${['Reels','Карусель','Пост','Пост со скидкой','Сторис-опрос','Stories','Видео'].map(f=>`<option ${f===c.format?'selected':''}>${f}</option>`).join('')}</select></td><td><input class="cell" type="number" data-list="competitors.${i}.followers" value="${esc(c.followers)}"></td><td><input class="cell" type="number" data-list="competitors.${i}.reactions" value="${esc(c.reactions)}"></td><td>${fmt(cRows()[i].er,2)}%</td><td><input class="cell wide" data-list="competitors.${i}.offer" value="${esc(c.offer)}"><br><input class="cell wide" data-list="competitors.${i}.known" value="${esc(c.known)}"></td><td><input class="cell wide" data-list="competitors.${i}.date" value="${esc(c.date)}"></td><td><label class="check"><input type="checkbox" data-list="competitors.${i}.verified" ${c.verified?'checked':''}> Проверено</label><span class="badge ${c.verified?'':'warn'}">${c.verified?'Проверено':'Ориентир'}</span></td><td><button class="btn small" data-action="remove-competitor" data-index="${i}">Удалить</button></td></tr>`).join('')}</tbody></table></div><div class="section"><div><h2>Матрица форматов</h2><p>Высокий ER — выше общего среднего; распространённый формат используют ≥ 50% конкурентов.</p></div></div><div class="tablewrap"><table><thead><tr><th>Формат</th><th>Средний ER</th><th>Доля конкурентов</th><th>Группа</th></tr></thead><tbody>${s.formats.map(x=>`<tr><td>${esc(x.format)}</td><td>${fmt(x.er,2)}%</td><td>${fmt(x.share*100)}%</td><td><span class="badge ${x.group.includes('Не копировать')?'red':x.group.includes('Тестировать')?'warn':''}">${x.group}</span></td></tr>`).join('')}</tbody></table></div><div class="section"><div><h2>Методика сбора данных</h2><p>Ссылки, ограничения и пробелы в наблюдениях.</p></div></div><div class="card">${textarea('Методика','method',state.method)}<div class="notice">Таблица содержит учебные значения из контрольной проверки ТЗ, а не проверенный срез реальных школ. Перед защитой добавьте ссылки и фактические реакции пяти последних постов конкурентов.</div></div>`}
function renderChannels(){let rs=cResults(),best=bestChannel(),spend=rs.reduce((a,x)=>a+x.budget,0),clients=rs.reduce((a,x)=>a+x.clients,0);return head('Вкладка 3 · Привлечение','Каналы','Смоделируйте 3–5 способов привлечения и сравните прогнозный CAC с LTV.',`<button class="btn primary" data-action="add-channel">＋ Добавить канал</button>`)+`<div class="grid g4">${metric('Маркетинг-бюджет',money(state.marketing),'План из dashboard.html','')}${metric('План каналов',money(spend),`Сумма бюджетов · ${spend<=num(state.marketing)?'в пределах':'выше'} бюджета`,spend<=num(state.marketing)?'green':'red')}${metric('Прогноз клиентов',fmt(clients,1),`Цель: ${fmt(state.target)} / мес.`,clients>=num(state.target)?'green':'yellow')}${metric('Лучший канал',best?esc(best.name):'Пока нет','Порог: минимум 25% месячной цели','pink')}</div><div class="section"><div><h2>Модель каналов</h2><p>Отметка «Проверено» означает подтверждённый источник входных данных.</p></div></div>${state.channels.map((c,i)=>{let x=rs[i];return `<div class="card channelrow"><div class="channel"><div class="field"><label>Канал · сторона клиента</label><input data-list="channels.${i}.name" value="${esc(c.name)}"><select class="cell" data-list="channels.${i}.side"><option ${c.side==='Покупатель'?'selected':''}>Покупатель</option><option ${c.side==='Платящая сторона'?'selected':''}>Платящая сторона</option><option ${c.side==='Вторая сторона'?'selected':''}>Вторая сторона</option><option ${c.side==='Спонсор'?'selected':''}>Спонсор</option></select></div><div class="field"><label>Модель</label><select class="cell" data-list="channels.${i}.paid"><option value="true" ${c.paid?'selected':''}>Платный</option><option value="false" ${!c.paid?'selected':''}>Бесплатный</option></select></div><div class="field"><label>${c.paid?'Бюджет, ₸':'Контакты / мес.'}</label><input type="number" class="cell" data-list="channels.${i}.${c.paid?'budget':'contacts'}" value="${c.paid?c.budget:c.contacts}"></div><div class="field"><label>${c.paid?'Цена контакта, ₸':'Расход на контент, ₸'}</label><input type="number" class="cell" data-list="channels.${i}.${c.paid?'costContact':'budget'}" value="${c.paid?c.costContact:c.budget}"></div><div class="field"><label>Конверсия, %</label><input type="number" class="cell" data-list="channels.${i}.conversion" value="${c.conversion}" step="0.1"></div><button class="btn small" data-action="remove-channel" data-index="${i}">Удалить</button></div><div class="row3" style="margin-top:10px"><div class="field"><label>Почему выбран</label><input data-list="channels.${i}.why" value="${esc(c.why)}"></div><div class="field"><label>Источник цифр</label><input data-list="channels.${i}.source" value="${esc(c.source)}"></div><div class="field"><label>Факт · клиентов</label><input class="fact" type="number" data-list="channels.${i}.fact" value="${esc(c.fact)}" placeholder="Заполнить после теста"></div></div><label class="check"><input type="checkbox" data-list="channels.${i}.verified" ${c.verified?'checked':''}> Данные проверены</label><div class="grid g4" style="margin-top:13px"><div><div class="label">Контакты / мес.</div><b>${fmt(x.contacts,1)}</b><div class="formula">${c.paid?'Бюджет ÷ цена контакта':'Введённый прогноз'}</div></div><div><div class="label">Клиенты / мес.</div><b>${fmt(x.clients,2)}</b><div class="formula">Контакты × конверсия</div></div><div><div class="label">CAC канала</div><b>${money(x.cac)}</b><div class="formula">Расходы ÷ клиенты</div></div><div><div class="label">LTV ÷ CAC</div><span class="badge ${x.status==='Окупится'?'':x.status==='Бесплатный'?'':x.status==='Спорно'?'warn':'red'}">${x.status==='Бесплатный'?'∞ · Бесплатный':fmt(x.ratio,1)+' · '+x.status}</span><div class="formula">≥ 3 окупится · 1–3 спорно · &lt; 1 убыток</div></div></div></div>`}).join('')}<div class="notice"><strong>Правило лучшего канала:</strong> сначала отбираем каналы с ≥ 25% цели (${fmt(num(state.target)*.25,1)} клиента), затем выбираем наибольшее LTV ÷ CAC; бесплатный канал в пуле — лучший.</div>`}
function suggest(c){let stats=cStats(),picks=stats.formats.filter(x=>x.group==='Взять и усилить').map(x=>x.format);let format=picks[0]||stats.formats.sort((a,b)=>b.er-a.er)[0]?.format||'Короткое видео';let metricName=state.projectType==='education'?'заявок на пробный урок':state.projectType==='b2b'?'квалифицированных заявок':'заказов';return{format,offer:`«Покажем, как ${state.product.toLowerCase()} решает задачу подарка — персональная упаковка к первому заказу»`,cta:'Напишите в Direct слово «ПОДАРОК» — пришлём подборку и сроки доставки.',metric:`${Math.max(1,Math.round(c.clients||2))} ${metricName} за 30 дней`,why:`Проверить формат ${format}: ориентир по ER конкурентной выборки ${fmt(stats.overall,2)}%; подтвердить метрику тестом. Источник выборки — вкладка «Конкуренты».`}}function copyPrompt(c){let s=suggest(c);return `Ты GTM-консультант. Проект: ${state.product}; аудитория: ${state.audience}; канал: ${c.name}; прогноз контактов ${fmt(c.contacts,1)}, клиентов ${fmt(c.clients,1)}, CAC ${money(c.cac)}, LTV ${money(ltv())}. Конкурентные форматы: ${cStats().formats.map(x=>`${x.format} ER ${fmt(x.er,2)}%, группа ${x.group}`).join('; ')}. Предложи формат, нетипичный оффер, CTA и конкретную метрику на месяц. Не выдумывай подтверждённые факты.`}function renderAI(){let rs=cResults();return head('Вкладка 4 · Тактика','Рекомендации ИИ','Сгенерируйте черновик для канала, затем отредактируйте и зафиксируйте решение команды.',`<button class="btn" data-action="copy-all">Скопировать запросы</button>`)+`<div class="notice"><strong>ИИ-подсказка — черновик.</strong> Используйте группы форматов конкурентов как ориентир, проверяйте оффер на соответствие продукту и не воспринимайте цифры как факт.</div><div class="section"><div><h2>Рекомендации по каналам</h2><p>Скопируйте промпт в ИИ, при желании вставьте ответ и отредактируйте финальное решение.</p></div></div>${rs.map(c=>{let r=state.recommendations[c.name]||suggest(c);return `<div class="card" style="margin-bottom:13px"><div class="section" style="margin-top:0"><div><h2>${esc(c.name)}</h2><p>${fmt(c.clients,1)} клиента / мес. · CAC ${money(c.cac)}</p></div><div class="actionsbar"><button class="btn small" data-action="copy-prompt" data-index="${c.i}">Скопировать запрос</button><button class="btn small primary" data-action="suggest" data-index="${c.i}">Получить рекомендацию</button></div></div><div class="row3">${[['Формат','format'],['Оффер','offer'],['Призыв к действию','cta'],['Метрика с цифрой','metric'],['Почему','why']].map(([l,k])=>`<div class="field"><label>${l}</label><textarea data-rec="${esc(c.name)}.${k}">${esc(r[k]||'')}</textarea></div>`).join('')}</div><div class="field"><label>Ответ ИИ · опционально</label><textarea data-rec="${esc(c.name)}.aiAnswer" placeholder="Вставьте ответ, затем скорректируйте поля выше.">${esc(r.aiAnswer||'')}</textarea></div><label class="check"><input type="checkbox" data-rec="${esc(c.name)}.accepted" ${r.accepted?'checked':''}> ${r.accepted?'Приняли':'Изменили'} рекомендацию команды</label></div>`}).join('')}`}
function makePlan(){let rows=[];for(let w=1;w<=4;w++)for(let c of state.channels){let r=state.recommendations[c.name]||suggest(c);rows.push({phase:`Неделя ${w} · Тест`,channel:c.name,format:r.format||'Reels',topic:`Проверяем спрос на ${state.product.toLowerCase()}`,offer:r.offer||'Подборка и персональная упаковка',cta:r.cta||'Напишите в Direct',goal:r.metric||'Фиксировать переходы и заказы',budget:c.paid?Math.round(num(c.budget)/4):num(c.budget)})}for(let w of [5,9])for(let c of state.channels){let r=state.recommendations[c.name]||suggest(c);rows.push({phase:w===5?'Недели 5–8 · Усиление':'Недели 9–12 · Масштаб и удержание',channel:c.name,format:r.format||'Повторить лучший формат',topic:'Усилить вариант с лучшим фактическим CAC',offer:r.offer||'Предложение команды',cta:r.cta||'Призыв к заказу',goal:r.metric||'Сравнить CAC и конверсию',budget:c.paid?num(c.budget):0})}state.plan=rows;save();render();toast('Черновик плана создан')}function renderPlan(){if(!state.plan.length)state.plan=makeInitialPlan();return head('Вкладка 5 · 90 дней','Контент-план','Тест → усиление подтверждённых каналов → масштаб и удержание.',`<button class="btn primary" data-action="make-plan">Черновик плана от ИИ</button><button class="btn" data-action="copy-plan">Скопировать запрос</button>`)+`<div class="grid g3"><div class="card"><span class="badge">Недели 1–4</span><h2 style="margin-top:10px">Тест</h2><p class="sub">Все каналы, небольшой бюджет, заполняем факт.</p></div><div class="card"><span class="badge warn">Недели 5–8</span><h2 style="margin-top:10px">Усиление</h2><p class="sub">Бюджет в каналы, где факт не хуже прогноза.</p></div><div class="card"><span class="badge">Недели 9–12</span><h2 style="margin-top:10px">Масштаб и удержание</h2><p class="sub">Увеличиваем подтверждённое, возвращаем покупателей.</p></div></div><div class="section"><div><h2>Редактируемый план</h2><p>На неделях 1–4 указаны все каналы по каждой неделе; далее план по этапам.</p></div></div><div class="tablewrap"><table><thead><tr><th>Этап</th><th>Канал</th><th>Формат</th><th>Тема / задача</th><th>Оффер</th><th>CTA</th><th>Цель метрики</th><th>Бюджет, ₸</th></tr></thead><tbody>${state.plan.map((p,i)=>`<tr>${['phase','channel','format','topic','offer','cta','goal','budget'].map(k=>`<td><input class="cell ${['topic','offer','cta','goal'].includes(k)?'wide':''}" ${k==='budget'?'type="number"':''} data-plan="${i}.${k}" value="${esc(p[k])}"></td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="footerline">План — заготовка для обсуждения. После теста обновите фактические контакты, конверсии и расходы каналов.</div>`}function makeInitialPlan(){let rows=[];for(let w=1;w<=4;w++)for(let c of state.channels)rows.push({phase:`Неделя ${w} · Тест`,channel:c.name,format:'Reels / карусель',topic:`Проверка спроса: ${state.product}`,offer:'Персональная упаковка и подборка',cta:'Напишите в Direct',goal:`${Math.max(1,Math.round(num(state.target)/4))} заказов за этап теста`,budget:c.paid?Math.round(num(c.budget)/4):0});for(let phase of ['Недели 5–8 · Усиление','Недели 9–12 · Масштаб и удержание'])for(let c of state.channels)rows.push({phase,channel:c.name,format:'Повторить лучший формат',topic:'Опираемся на результаты этапа теста',offer:'Оффер по данным аудитории',cta:'Заказать / запросить подборку',goal:'CAC не выше допустимого',budget:c.paid?num(c.budget):0});return rows}
function renderSummary(){let b=bestChannel(),rs=cResults(),spend=rs.reduce((a,x)=>a+x.budget,0),cl=rs.reduce((a,x)=>a+x.clients,0),unverified=[...['price','cost','tax','fees','marketing','target'].filter(k=>!state[`${k}Verified`]),...rs.filter(x=>!x.verified).map(x=>x.name)];let r=b?(state.recommendations[b.name]||suggest(b)):null;return head('Вкладка 6 · Решение','Итог и первые проверки','Соберите прогноз, решение команды и список гипотез для проверки в первые 30 дней.',`<button class="btn" data-action="export">Скачать данные JSON</button>`)+`<div class="hero"><div class="eyebrow">Решение команды</div><h2>${b?`Тестировать канал «${esc(b.name)}» первым`:'Недостаточно каналов для выбора'}</h2><p>${b?`Он достигает порога ${fmt(num(state.target)*.25,1)} клиента и имеет прогнозный LTV/CAC ${fmt(b.ratio,1)}. Это модель по ориентирам, не подтверждённый результат.`:'Добавьте канал, который прогнозирует не менее четверти цели по клиентам.'}</p></div><div class="grid g4" style="margin-top:14px">${metric('Маржа на покупку',money(margin()),'Цена − себестоимость − налог − комиссия','green')}${metric('LTV',money(ltv()),'Маржа × число покупок / срок жизни','pink')}${metric('Расходы каналов',money(spend),`Бюджет: ${money(state.marketing)}`,spend<=num(state.marketing)?'green':'red')}${metric('Прогноз / цель',`${fmt(cl,1)} / ${fmt(state.target)}`,'Клиенты в месяц · модель','yellow')}</div><div class="twocol" style="margin-top:14px"><div class="card"><h2>Канал, формат и оффер</h2><p class="sub">Предварительная рекомендация на основе модели и ER-сводки.</p>${b&&r?`<div class="step"><div class="n">1</div><div><h3>${esc(b.name)} · ${esc(r.format)}</h3><p>${esc(r.why)}</p></div></div><div class="step"><div class="n">2</div><div><h3>Оффер</h3><p>${esc(r.offer)}</p></div></div><div class="step"><div class="n">3</div><div><h3>CTA и метрика</h3><p>${esc(r.cta)} · ${esc(r.metric)}</p></div></div>`:'<div class="empty">Добавьте каналы и заполните целевые показатели.</div>'}</div><div class="card"><h2>Что проверить за 30 дней</h2><p class="sub">В первую очередь — числа со статусом «Ориентир».</p><div class="step"><div class="n">01</div><div><h3>Фактическая цена контакта</h3><p>Сверить рекламный кабинет, предложения блогеров и расходы на контент.</p></div></div><div class="step"><div class="n">02</div><div><h3>Конверсия в покупку</h3><p>Замерить обращения, заказы и источник каждого клиента.</p></div></div><div class="step"><div class="n">03</div><div><h3>Повторные покупки и ER</h3><p>Собрать реальные повторы и реакции по 5 постам выбранного формата.</p></div></div><div class="step"><div class="n">04</div><div><h3>Проверить источники конкурентов</h3><p>${Math.max(0,state.competitors.filter(x=>!x.verified).length)} наблюдений отмечены как ориентиры.</p></div></div></div></div><div class="section"><div><h2>Источники и уверенность</h2><p>Исходные числа взяты из dashboard.html; прогнозные данные нужно подтвердить.</p></div></div><div class="notice">Финансовые значения перенесены из dashboard.html: цена 6 000 ₸, себестоимость 2 235 ₸, налог 4%, реклама 10 000 ₸/мес.; там также указаны охват 50 в день, конверсия 2%, 30 онлайн-продаж в месяц, мощность 200 шт. и 60 продаж в среднем месяце. Это товарные вводные; референс Claude описывает абонемент школы 3D за 30 000 ₸/мес. Перед выводом по LTV/CAC подтвердите, что цена, себестоимость и churn из дашборда относятся к этому абонементу. Канальные цифры из ТЗ и референса — учебные прогнозы; суммарные расходы могут превышать бюджет dashboard.html.</div><div class="footerline">ИИ может рекомендовать, но итоговое решение всегда за человеком.</div>`}
function makeContent(){let f={canvas:renderCanvas,competitors:renderCompetitors,channels:renderChannels,ai:renderAI,plan:renderPlan,summary:renderSummary};document.querySelector('#app').innerHTML=f[current]();nav()}
function setPath(path,val){let [root,...rest]=path.split('.');if(rest.length===1&&/^\d+$/.test(rest[0])){state[root][+rest[0]]=val;return}let o=state;for(let k of path.split('.').slice(0,-1))o=o[k];o[path.split('.').at(-1)]=val}
function recUpdate(path,val){let dot=path.lastIndexOf('.'),name=path.slice(0,dot),key=path.slice(dot+1);state.recommendations[name]??=suggest(cResults().find(x=>x.name===name)||{name,clients:1});state.recommendations[name][key]=val}
document.addEventListener('click',async e=>{let t=e.target.closest('[data-tab],[data-action]');if(!t)return;if(t.dataset.tab){current=t.dataset.tab;makeContent();return}let a=t.dataset.action,i=Number(t.dataset.index);if(a==='add-competitor')state.competitors.push({name:`Конкурент ${state.competitors.length+1}`,url:'',channel:'Instagram',format:'Reels',followers:0,reactions:0,offer:'',date:'',verified:false,known:''});if(a==='remove-competitor')state.competitors.splice(i,1);if(a==='add-channel')state.channels.push({name:'Новый канал',paid:false,budget:0,costContact:0,contacts:0,conversion:1,why:'',source:'Ориентир команды',verified:false,side:'Покупатель',fact:''});if(a==='remove-channel')state.channels.splice(i,1);if(a==='suggest'){let c=cResults()[i];state.recommendations[c.name]=suggest(c)}if(a==='copy-prompt'){let c=cResults()[i];await navigator.clipboard.writeText(copyPrompt(c));toast('Запрос скопирован')}if(a==='copy-all'){await navigator.clipboard.writeText(cResults().map(c=>copyPrompt(c)).join('\n\n---\n\n'));toast('Запросы скопированы')}if(a==='make-plan'){makePlan();return}if(a==='copy-plan'){await navigator.clipboard.writeText(`Составь план GTM на 90 дней для ${state.product}, аудитория ${state.audience}. Цель: ${state.goal90}. Каналы: ${cResults().map(x=>`${x.name}: прогноз ${fmt(x.clients,1)} клиентов, бюджет ${money(x.budget)}, CAC ${money(x.cac)}`).join('; ')}. План 1–4 недели по каждому каналу, 5–8 усиление подтверждённого, 9–12 масштаб и удержание. Укажи формат, тему, оффер, CTA, числовую метрику.`);toast('Запрос к плану скопирован')}if(a==='reset'){if(confirm('Вернуть исходные значения из dashboard.html?')){state=structuredClone(defaults)}}if(a==='export'){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),link=document.createElement('a');link.href=u;link.download='gtm-market-pilot.json';link.click();URL.revokeObjectURL(u);return}save();makeContent()});
document.addEventListener('input',e=>{let t=e.target;if(t.dataset.key){state[t.dataset.key]=t.type==='number'?num(t.value):t.value;save()}else if(t.dataset.list){let [arr,index,...keys]=t.dataset.list.split('.'),key=keys.join('.');let val=t.type==='checkbox'?t.checked:t.type==='number'?num(t.value):t.value;if(key==='paid')val=val==='true';state[arr][+index][key]=val;save()}else if(t.dataset.rec){recUpdate(t.dataset.rec,t.type==='checkbox'?t.checked:t.value);save()}else if(t.dataset.plan){let [i,k]=t.dataset.plan.split('.');state.plan[+i][k]=t.type==='number'?num(t.value):t.value;save()}});
document.addEventListener('change',e=>{let t=e.target;if(t.dataset.key){state[t.dataset.key]=t.type==='number'?num(t.value):t.value;save();makeContent()}else if(t.dataset.list){let [arr,index,...keys]=t.dataset.list.split('.'),key=keys.join('.');let val=t.type==='checkbox'?t.checked:t.value;if(key==='paid')val=val==='true';state[arr][+index][key]=val;save();makeContent()}else if(t.dataset.rec){recUpdate(t.dataset.rec,t.type==='checkbox'?t.checked:t.value);save()}else if(t.dataset.plan){let [i,k]=t.dataset.plan.split('.');state.plan[+i][k]=t.value;save()}});
makeContent();
</script></body></html>
