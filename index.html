class OfflineChart {

 paint(){const el=this.canvas,ratio=window.devicePixelRatio||1,w=Math.max(330,el.parentElement.clientWidth||600),h=300;
 el.width=Math.round(w*ratio);el.height=Math.round(h*ratio);const g=el.getContext('2d');g.scale(ratio,ratio);g.clearRect(0,0,w,h);

 const txt=(t,x,y,color='#263e50',align='left',size=12)=>{g.fillStyle=color;g.font=`${size}px Arial`;g.textAlign=align;g.fillText(String(t),x,y)};
 const val=v=>Number.isFinite(+v)?Math.round(+v).toLocaleString('ru-RU'):'—';
 if(type==='doughnut') {const ds=sets[0],values=ds.data.map(v=>Math.max(0,+v||0)),total=values.reduce((a,b)=>a+b,0),cx=Math.min(w*.34,200),cy=130,r=94;let angle=-Math.PI/2;
 values.forEach((v,i)=>{const end=angle+(total?v/total:0)*Math.PI*2;g.beginPath();g.arc(cx,cy,r,angle,end);g.arc(cx,cy,r*.53,end,angle,true);g.closePath();g.fillStyle=(ds.backgroundColor||colors)[i%colors.length];g.fill();angle=end});
 labels.forEach((label,i)=>{const x=w*.57,y=70+i*57;g.fillStyle=(ds.backgroundColor||colors)[i%colors.length];g.fillRect(x,y-12,11,11);txt(label,x+17,y-2);txt(val(values[i])+' '+unit,x+17,y+17,'#193653','left',13)});return;}
 const left=70,right=24,top=28,bottom=62,plotW=w-left-right,plotH=h-top-bottom;
 const all=sets.flatMap(d=>d.data.map(v=>Number(v)||0));let min=Math.min(0,...all),max=Math.max(0,...all);if(max===min)max=min+1;const pad=(max-min)*.12;max+=pad;min-=pad;
 const y=v=>top+(max-v)/(max-min)*plotH;
 g.strokeStyle='#e1e8ed';g.lineWidth=1;for(let i=0;i<=4;i++){const v=min+(max-min)*i/4,yy=y(v);g.beginPath();g.moveTo(left,yy);g.lineTo(w-right,yy);g.stroke();txt(val(v),left-8,yy+4,'#607480','right',11)}
 g.strokeStyle='#9cb1bf';g.beginPath();g.moveTo(left,y(0));g.lineTo(w-right,y(0));g.stroke();
 const step=plotW/Math.max(1,labels.length);if(type==='line'){
 sets.forEach((ds,j)=>{g.strokeStyle=ds.borderColor||colors[j];g.lineWidth=3;g.beginPath();ds.data.forEach((v,i)=>{const x=left+step*(i+.5),yy=y(+v||0);if(i===0)g.moveTo(x,yy);else g.lineTo(x,yy)});g.stroke();ds.data.forEach((v,i)=>{g.beginPath();g.arc(left+step*(i+.5),y(+v||0),3,0,Math.PI*2);g.fillStyle=ds.borderColor||colors[j];g.fill()})})
 }else{sets.forEach((ds,j)=>ds.data.forEach((v,i)=>{const n=+v||0,bw=Math.min(70,step*.65)/sets.length,x=left+step*(i+.5)-bw*sets.length/2+bw*j,yy=y(n),base=y(0);g.fillStyle=Array.isArray(ds.backgroundColor)?ds.backgroundColor[i]:ds.backgroundColor||colors[j];g.fillRect(x,Math.min(yy,base),Math.max(2,bw-3),Math.max(1,Math.abs(base-yy)));if(labels.length<=4)txt(val(n),x+bw/2, n>=0?yy-5:yy+16,'#263e50','center',11)}))}
 const skip=Math.max(1,Math.ceil(labels.length/6));labels.forEach((label,i)=>{if(i%skip)return;let t=String(label);if(t.length>19)t=t.slice(0,17)+'…';txt(t,left+step*(i+.5),h-37,'#526b7a','center',11)});
 sets.forEach((ds,i)=>{const x=left+i*Math.min(190,plotW/sets.length);g.fillStyle=ds.borderColor||(Array.isArray(ds.backgroundColor)?ds.backgroundColor[0]:ds.backgroundColor)||colors[i];g.fillRect(x,h-18,10,10);txt(ds.label||'',x+15,h-9,'#526b7a','left',11)});
 }
}
