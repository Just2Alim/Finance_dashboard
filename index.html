const lst=(k,t,qp)=>`<div class="card"><h3>${t} — итого <b id="tot-${k}"></b></h3><table><tr><th>Статья</th>${qp?'<th>Кол-во</th><th>Цена, тг</th>':'<th>тг/мес</th>'}<th>Источник и дата</th><th></th></tr>${p[k].map((x,i)=>`<tr><td><input type="text" data-k="${k}.${i}.n" value="${esc(x.n)}"></td>${qp?`<td><input type="number" step="any" data-k="${k}.${i}.q" value="${x.q}"></td>`:''}<td><input type="number" step="any" data-k="${k}.${i}.p" value="${x.p}"></td><td><input type="text" data-k="${k}.${i}.s" placeholder="источник и дата" value="${esc(x.s)}"></td><td><button data-del="${k}.${i}">✕</button></td></tr>`).join('')}</table><button data-add="${k}">+ добавить статью</button></div>`;
function dataHTML(){return`<p>Здесь вводятся только <b>вводные</b>. Все метрики считаются формулами на других вкладках.</p>
${tb('Налоги и общие ставки',[['tax','Ставка налога (упрощёнка, 2–6%)','%',100],['ipn','ИПН на ОУР','%',100],['coef','Коэффициент полной стоимости сотрудника','×',1],['ip','Платежи ИП за себя','тг/мес',1],['days','Дней в месяце','дн',1]])}
<div class="card"><b>Обоснование налогового режима:</b><textarea rows="2" data-k="why">${esc(p.why)}</textarea></div>
${tb('Шаг 2. Цена',[['price','Цена одной единицы','тг',1],['upp','Единиц в одной покупке','шт',1]])}${lst('cost','Шаг 2. Себестоимость единицы (количество × цена)',1)}
${tb('Шаг 3. Продажи',[['flow','Людей в день видят предложение (средний месяц)','шт',1],['conv','Доля, которые покупают','%',100],['onl','Онлайн-продажи в месяц (средний)','шт',1],['lflow','Людей в день (месяц запуска)','шт',1],['lonl','Онлайн-продажи (месяц запуска)','шт',1],['best','Спрос лучшего месяца','шт',1],['cap','Мощность: максимум в месяц','шт',1]])}
${lst('emp','Шаг 4. Оклады сотрудников (взносы ×1,11 добавятся сами)',0)}${lst('opex','Шаг 4. Постоянные расходы OPEX (без зарплат)',0)}${lst('capex','Шаг 4. Разовые вложения CAPEX (количество × цена)',1)}
${tb('Шаг 7. Юнит-экономика',[['disc','Размер скидки','%',100],['rep','Доля клиентов, купивших повторно','%',100]])}
${tb('Шаг 8. Сценарии',[['sp','Пессимистичный: продажи','%',100],['pp','Пессимистичный: цена','%',100],['so','Оптимистичный: продажи','%',100],['po','Оптимистичный: цена','%',100]])}
${tb('Шаг 9. Деньги на старт',[['mon','Месяцев раскачки','мес',1],['res','Резерв от CAPEX','%',100]])}
<div class="card"><h3>Факт (или «Загрузить факт»)</h3><table>${[['sales','Продажи пилота, шт'],['pre','Предзаказы, шт'],['survey','Опрос: доля готовых купить, %'],['comp','Реальная цена конкурентов, тг']].map(([k,l])=>`<tr><td>${l}</td><td><input type="number" step="any" data-k="fact.${k}" value="${p.fact[k]??''}"></td></tr>`).join('')}</table></div>
<div class="card"><h3>Карта данных</h3><table><tr><th>Показатель</th><th>Вводное или метрика</th><th>Источник / формула</th><th>Почему так</th></tr>${MAP.map(r=>`<tr><td>${r[0]}</td><td class="${r[1]=='метрика'?'tg':'ty'}">${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td></tr>`).join('')}</table></div>
<div class="card"><h3>Сверка с учебным примером (нажмите «Загрузить пример»: все строки должны быть ✓)</h3><div id="sv"></div></div>`}
function sverka(){const n=calc(p,{ds:0,dp:0,dx:0}),a=calc(p,{ds:p.sp,dp:p.pp,dx:0}),c=calc(p,{ds:p.so,dp:p.po,dx:0}),e=1e-6;
const X=[['Себестоимость единицы, тг',2235,n.cost],['Налог с продажи, тг',240,n.tax],['Маржинальная прибыль, тг',3525,n.m],['Наценка',1.684563758,n.nmark,e],['Маржа',.6275,n.mrg,e],['Продажи: средний месяц',60,n.sales],['Продажи: запуск',24,n.launch],['Продажи: лучший месяц',150,n.best],['OPEX в месяц, тг',136025,n.opex],['CAPEX, тг',141500,n.capex],['ТБ без округления',38.58865248,n.be0,e],['ТБ, шт',39,n.be],['ТБ в день',2,n.day],['ТБ в чеках',39,n.chk],['ТБ в деньгах, тг',234000,n.rev],['Запас прочности',.35,n.safe,e],['Доля мощности для нуля',.195,n.cshare,e],['Прибыль: запуск, тг',-51425,n.lp],['Прибыль: средний, тг',75475,n.ap],['Прибыль: лучший, тг',392725,n.bp],['Цена со скидкой, тг',5400,n.pd],['Маржинальная со скидкой, тг',2949,n.md],['Падение маржинальной',.1634042553,n.drop,e],['Продаж со скидкой, шт',72,n.need],['Рост продаж',.2,n.need/n.sales-1,e],['Загрузка мощности',.3,n.load,e],
['Сценарии: продажи (песс./оптим.)',42,a.sales],['',72,c.sales],['Сценарии: ТБ песс.',47,a.be],['ТБ оптим.',36,c.be],['Прибыль песс., тг',-12167,a.ap],['Прибыль оптим., тг',138511,c.ap],['Загрузка песс.',.21,a.load,e],['Загрузка оптим.',.36,c.load,e],['Потребность в деньгах: база, тг',309925,n.money],['Прибыль запуска песс., тг',-85892,a.lp],['Потребность в деньгах: песс., тг',413326,a.money]];
let ok=0;const rs=X.map(([l,x,g,t=.5])=>{const m=Math.abs(x-g)<t;ok+=m;return`<tr><td>${l}</td><td>${fmt(x,4)}</td><td>${fmt(g,4)}</td><td class="${m?'tg':'tr'}">${m?'✓':'✗'}</td></tr>`}).join('');
return`<p><b>Совпало ${ok} из ${X.length}</b></p><table><tr><th>Показатель</th><th>Ожидаемо (таблица курса)</th><th>Дашборд</th><th></th></tr>${rs}</table>`}
function dyn(){['cost','emp','opex','capex'].forEach(k=>{const e=$('#tot-'+k);if(e)e.textContent=T(S(p[k]))});$('#sv').innerHTML=sverka()}
const sget=k=>k.split('.').reduce((o,x)=>o?.[x],p);
function sset(k,v){const a=k.split('.');let o=p;for(let i=0;i<a.length-1;i++)o=o[a[i]]??={};o[a.at(-1)]=v}
function show(t,keep){tab=t;const y=scrollY;post=[];$('#pane').innerHTML=t=='data'?dataHTML():V[t]();post.forEach(f=>f());document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==t));if(t=='data')dyn();scrollTo(0,keep?y:0)}
function updBar(){const rate=sl.t??(p.mode=='our'?p.ipn:p.tax);$('[data-k=mode]').value=p.mode;$('[data-sl=p]').value=sl.p*100;$('[data-sl=s]').value=sl.s*100;$('[data-sl=x]').value=sl.x*100;$('[data-sl=t]').value=rate*100;
$('#vp').textContent=fmt(sl.p*100)+' %';$('#vs').textContent=fmt(sl.s*100)+' %';$('#vx').textContent=fmt(sl.x*100)+' %';$('#vt').textContent=fmt(rate*100,1)+' %';document.querySelectorAll('[data-sc]').forEach(b=>b.classList.toggle('on',b.dataset.sc==sc))}
function render(){updBar();tab=='data'?dyn():show(tab,1)}
const TABS=[['main','Главное'],['price','Цена и точка безубыточности'],['three','Три месяца'],['unit','Юнит-экономика'],['scen','Сценарии'],['kpi','KPI команды'],['data','Данные']];
$('#nav').innerHTML=TABS.map(([k,l])=>`<button data-t="${k}">${l}</button>`).join('');
function dl(n,b){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),999)}
const LB={'Налог на упрощённой декларации':'tax','Коэффициент полной стоимости сотрудника':'coef','Платежи ИП за себя':'ip','Дней в месяце для расчёта «в день»':'days','Цена одной единицы':'price','Единиц в одной покупке':'upp','Средний месяц: людей в день видят предложение':'flow','Доля, которые покупают':'conv','Средний месяц: онлайн-продажи в месяц, шт':'onl','Месяц запуска: людей в день':'lflow','Месяц запуска: онлайн-продажи':'lonl','Лучший месяц: спрос':'best','Мощность: максимум в месяц':'cap','Проверка скидкой: размер скидки':'disc','Пессимистичный: изменение «продажи в месяц»':'sp','Пессимистичный: изменение «цена»':'pp','Оптимистичный: изменение «продажи в месяц»':'so','Оптимистичный: изменение «цена»':'po','Месяцев раскачки':'mon','Резерв от CAPEX':'res'};
function fromX(wb){const n=wb.SheetNames.find(x=>/^\d/.test(x));if(!n){alert('Не нашла вкладку проекта (например «1 Товар»).');return}
const rows=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:''}),q=Object.assign(START(),{cost:[],emp:[],opex:[],capex:[]});q.src={};let sec='';
rows.forEach(r=>{const a=String(r[0]).trim(),b=r[1],s=String(r[5]||'').trim();
if(/^ШАГ 2/.test(a))sec='cost';else if(/^ШАГ 3/.test(a))sec='';else if(/^ШАГ 4\. Расходы: постоянные/.test(a))sec='emp';else if(a=='Полная стоимость сотрудников')sec='opex';else if(/^ИТОГО постоянные/.test(a))sec='';else if(/^ШАГ 4\. Расходы: разовые/.test(a))sec='capex';else if(/^(ИТОГО CAPEX|ШАГ 5)/.test(a))sec='';
else if(LB[a]&&typeof b=='number'){q[LB[a]]=b;q.src[LB[a]]=s}
else if(sec&&typeof b=='number'){if(sec=='cost'){if(/^Себестоимость:/.test(a))q.cost.push({n:a.replace(/^Себестоимость:\s*/,''),q:1,p:b,s})}else if(!(sec=='opex'&&a=='Платежи ИП за себя'))q[sec].push({n:a,q:1,p:b,s})}});
p=q;sl={p:0,s:0,x:0,t:null};sc='base'}
function readFile(f,cb){const r=new FileReader();r.onload=()=>cb(r.result);r.readAsArrayBuffer(f)}
$('#f1').onchange=e=>{const f=e.target.files[0];if(!f)return;if(/\.json$/i.test(f.name)){const r=new FileReader();r.onload=()=>{p=Object.assign(START(),JSON.parse(r.result));render();show(tab)};r.readAsText(f)}else readFile(f,b=>{fromX(XLSX.read(b));show(tab);updBar()});e.target.value=''};
$('#f2').onchange=e=>{const f=e.target.files[0];if(!f)return;readFile(f,b=>{const wb=XLSX.read(b),r=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''});['sales','pre','survey','comp'].forEach((k,i)=>{const v=r[i+1]?.[2];if(v!==''&&v!=null&&!isNaN(v))p.fact[k]=+v});show(tab)});e.target.value=''};
document.addEventListener('click',e=>{const t=e.target,d=t.dataset;if(!d)return;
if(d.t)show(d.t);else if(d.sc){sc=d.sc;render()}
else if(d.add){d.add=='kpi'?p.kpi.push({n:'',t:'',d:'',o:'',q:''}):p[d.add].push({n:'Новая статья',q:1,p:0,s:''});show(tab,1)}
else if(d.del){const[k,i]=d.del.split('.');p[k].splice(+i,1);show(tab,1)}
else if(d.dec){const[i,v]=d.dec.split(':');p.decs[i]=v;show(tab,1)}
else if(d.a=='load')$('#f1').click();else if(d.a=='fact')$('#f2').click();
else if(d.a=='save')dl('dashboard-data.json',new Blob([JSON.stringify(p,null,1)],{type:'application/json'}));
else if(d.a=='tpl'){const n=calc(p,O('base')),ws=XLSX.utils.aoa_to_sheet([['Показатель','План','Факт'],['Продажи пилота, шт',n.sales,''],['Предзаказы, шт',n.launch,''],['Опрос: доля готовых купить, %',p.conv*100,''],['Реальная цена конкурентов, тг',p.price,'']]),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Факт');XLSX.writeFile(wb,'shablon-fakta.xlsx')}
else if(d.a=='ex'){p=EX();sl={p:0,s:0,x:0,t:null};sc='base';updBar();show(tab)}
else if(d.a=='clr'){if(confirm('Очистить все данные?')){p=BLANK();sl={p:0,s:0,x:0,t:null};sc='base';updBar();show(tab)}}
else if(d.a=='rst'){sl={p:0,s:0,x:0,t:null};sc='base';render()}});
document.addEventListener('input',e=>{const t=e.target,k=t.dataset.k,s=t.dataset.sl;
if(t.dataset.fl){const f=t.dataset.fl;fl[f]=f=='ch'?t.value:+t.value;render();return}
if(s){sl[s]=+t.value/100;if(s=='t')sl.t=+t.value/100;render();return}
if(!k)return;const v=t.type=='number'?(t.value===''?0:+t.value/(+t.dataset.scale||1)):t.value;sset(k,v);if(k=='mode')sl.t=null;if(!/^(kpi|dec|why|fact|okr)/.test(k))render()});
document.addEventListener('change',e=>{if(/^okr/.test(e.target.dataset.k||''))show(tab,1)});
updBar();show('main');
